# 휴대폰에 바로 설치해 볼 수 있는 디버그 APK를 빌드한다.
#
# 쓰는 법
#   - claude/** 브랜치에 푸시하면 자동으로 돈다. Actions 탭에서 직접 실행해도 된다.
#   - 끝나면 실행 화면 아래 Artifacts 의 malang-key-debug-apk 를 내려받아 압축을 풀고 설치한다.
#   - 디버그 빌드는 패키지 이름이 dev.malangkey.debug 라서 Play 스토어 버전과 따로 설치된다.

name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malang-key-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
