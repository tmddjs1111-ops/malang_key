name: Build Mozc Android JNI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_mozc_android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Mozc Official Repository
      run: |
        git clone https://github.com/google/mozc.git
        cd mozc
        git checkout master

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install bazelisk
      run: |
        sudo npm install -g @bazel/bazelisk
        sudo apt-get update && sudo apt-get install -y unzip zip

    - name: Update Mozc Dependencies (Downloads NDK)
      run: |
        cd mozc/src
        python3 build_tools/update_deps.py

    # libmozc.so does not embed the dictionary; it loads mozc.data from a file path at runtime.
    # Build it from the same commit so the data version matches the engine.
    # The data generators run on the build machine, so this uses the Linux config
    # (under oss_android they are marked incompatible). The output file is platform-independent.
    - name: Build mozc.data (dictionary)
      run: |
        cd mozc/src
        bazelisk build //data_manager/oss:mozc_dataset_for_oss --config oss_linux --config release_build
        cp bazel-bin/data_manager/oss/mozc.data "$GITHUB_WORKSPACE/mozc.data"

    - name: Build libmozc.so for Android
      run: |
        cd mozc/src
        bazelisk build package --config oss_android --config release_build

    - name: Prepare Artifacts Directory
      run: |
        mkdir -p mozc-output
        # Copy output maintaining structure
        cp -r mozc/src/bazel-bin/android/jni mozc-output/jni_libs
        cp mozc.data mozc-output/mozc.data
        git -C mozc rev-parse HEAD > mozc-output/MOZC_COMMIT.txt

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mozc-android-build
        path: mozc-output/
