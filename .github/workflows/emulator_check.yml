# debug-latest 의 APK를 에뮬레이터에 설치해 테마별 키보드 화면을 찍는다.
#
# 쓰는 법
#   - .github/emulator/ 아래 파일을 바꿔 claude/** 브랜치에 푸시하면 돈다. Actions 탭에서 직접 실행해도 된다.
#   - 찍은 화면은 Releases 의 emulator-shots 에 올라간다.

name: Emulator check

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/emulator/**'
      - '.github/workflows/emulator_check.yml'

permissions:
  contents: write

concurrency:
  group: emulator-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download debug-latest -p 'malang-key-debug.apk' -D apk

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/emulator/check.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || exit 0
          gh release delete emulator-shots --cleanup-tag --yes || true
          gh release create emulator-shots shots/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "에뮬레이터 확인 (${GITHUB_SHA::7})" \
            --notes "에뮬레이터에서 찍은 키보드 화면입니다."
