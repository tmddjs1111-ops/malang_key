# 아이폰 버전을 TestFlight 에 올린다.
#
# 준비 (Apple Developer 계정이 생긴 뒤 한 번만)
#   1. App Store Connect → 앱 → 새로운 앱: 번들 ID dev.malangkey.ios, 이름 말랑키
#   2. App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API → 키 만들기(역할: 관리자)
#   3. GitHub 저장소 → Settings → Secrets and variables → Actions 에 넣기
#        APPLE_TEAM_ID              developer.apple.com → Membership 의 Team ID (10자리)
#        APPSTORE_ISSUER_ID         API 키 화면 위쪽의 Issuer ID
#        APPSTORE_KEY_ID            만든 키의 Key ID
#        APPSTORE_API_KEY_P8        내려받은 AuthKey_XXXX.p8 파일 내용 전체
#
# 쓰는 법
#   - Actions 탭 → Release iOS to TestFlight → Run workflow
#   - 빌드 번호는 이 워크플로의 실행 번호를 쓴다. 버전(1.0 등)은 ios/project.yml 의 MARKETING_VERSION.
#   - 서명은 Xcode 자동 서명(API 키)으로 처리해서 인증서 파일을 따로 만들 필요가 없다.
#   - Secrets 가 없으면 아무것도 하지 않고 끝난다.

name: Release iOS to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check secrets
        id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$ISSUER" ] && [ -n "$KEY_ID" ] && [ -n "$KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App Store Connect Secrets 가 없어서 건너뜀 (파일 맨 위 준비 참고)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Hangul composer tests
        if: steps.secrets.outputs.ready == 'true'
        run: swift test --package-path ios/MalangCore

      - name: Archive and upload
        if: steps.secrets.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER")

          xcodebuild archive \
            -project MalangKey.xcodeproj \
            -scheme MalangKey \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MalangKey.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${auth[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MalangKey.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"

          rm -f "$key"
          echo "::notice::TestFlight 에 빌드 $GITHUB_RUN_NUMBER 을 올렸습니다. App Store Connect 에서 처리되면 TestFlight 앱으로 설치할 수 있습니다."
