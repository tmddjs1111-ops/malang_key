# XcodeGen 설정. Mac 에서 `xcodegen generate` 하면 MalangKey.xcodeproj 가 생긴다.
# (생성된 .xcodeproj 는 커밋하지 않는다)
name: MalangKey
options:
  bundleIdPrefix: dev.malangkey
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  MalangCore:
    path: MalangCore

targets:
  MalangKey:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../app/src/main/assets/ime/media/emoji/ko.txt
        buildPhase: resources
    dependencies:
      - target: MalangKeyboard
      - package: MalangCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 말랑키
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/MalangKey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.malangkey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malangkey.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MalangKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      # 안드로이드와 같은 한국어 이모지 목록 (분류, 이름, 키워드)
      - path: ../app/src/main/assets/ime/media/emoji/ko.txt
        buildPhase: resources
    dependencies:
      - package: MalangCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 말랑키
        CFBundleDevelopmentRegion: ko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ko-KR
            IsASCIICapable: false
            PrefersRightToLeft: false
            # 전체 접근을 요구하지 않는다: 네트워크도 클립보드도 쓰지 않는 오프라인 키보드
            RequestsOpenAccess: false
    entitlements:
      path: Keyboard/MalangKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.malangkey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.malangkey.ios.keyboard

schemes:
  MalangKey:
    build:
      targets:
        MalangKey: all
        MalangKeyboard: all
    run:
      config: Debug
